<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141b2b" />
    <title>Prime Estates | Real Estate Consultants &amp; Developers in Coimbatore</title>
    <meta name="description" content="Prime Estates — leading real estate consultants &amp; developers in Coimbatore since 2008. Residential and commercial properties for sale and rent across Coimbatore, Tirupur, Pollachi, Ooty, Erode and Palakkad." />
    <!--
      Fonts are self-hosted (public/fonts, generated by .qa/fetch-fonts.mjs).
      Google Fonts cost a DNS + TLS handshake to a third-party origin and a
      render-blocking stylesheet before any glyph arrives. These are served
      from our own domain with an immutable cache header.

      Only the two faces needed for above-the-fold text are preloaded; the
      rest are discovered from the CSS and fetched as required.
    -->
    <link rel="preload" href="/fonts/jakarta-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfair-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- Hero image is the LCP element: start it in parallel with the CSS. -->
    <link rel="preload" as="image" href="/media/r/hero-estate-1408.avif"
          imagesrcset="/media/r/hero-estate-400.avif 400w, /media/r/hero-estate-800.avif 800w, /media/r/hero-estate-1408.avif 1408w"
          imagesizes="100vw" type="image/avif" fetchpriority="high" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
